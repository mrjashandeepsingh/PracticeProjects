<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE-D Schedule Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg1: #0f172a;
  --bg2: #1e293b;
  --text: #f1f5f9;
  --card: rgba(255,255,255,0.08);
}

.light {
  --bg1: #f8fafc;
  --bg2: #e2e8f0;
  --text: #0f172a;
  --card: rgba(0,0,0,0.05);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  color: var(--text);
  background: linear-gradient(-45deg, #0ea5e9, #8b5cf6, #ec4899, #06b6d4);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
  position: relative;
  overflow-x: hidden;
}

/* Animated Gradient */
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Noise Overlay */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: url("https://grainy-gradients.vercel.app/noise.svg");
  opacity: 0.05;
  pointer-events: none;
}

/* Container */
.wrapper {
  width: 100%;
  max-width: 1400px;
  backdrop-filter: blur(30px);
  background: var(--card);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

h1 {
  font-size: 2rem;
  font-weight: 700;
}

/* Toggle Button */
.toggle {
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: var(--card);
  color: var(--text);
  font-weight: 600;
}

/* Grid Layout */
.grid {
  display: grid;
  grid-template-columns: 120px repeat(8, 1fr);
  gap: 12px;
}

/* Cells */
.cell {
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;
  background: var(--card);
  transition: 0.3s ease;
}

.cell:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* Subject Colors */
.python { background: rgba(59,130,246,0.3); }
.maths { background: rgba(139,92,246,0.3); }
.chemistry { background: rgba(236,72,153,0.3); }
.english { background: rgba(16,185,129,0.3); }
.workshop { background: rgba(245,158,11,0.3); }
.lab { background: rgba(34,197,94,0.3); }
.break { background: rgba(148,163,184,0.3); }

/* Responsive */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">
  <h1>CSE-D Weekly Dashboard</h1>
  <button class="toggle" onclick="toggleTheme()">Toggle Mode</button>
</div>

<div class="grid">

<div class="cell"><strong>Day</strong></div>
<div class="cell">1</div>
<div class="cell">2</div>
<div class="cell">3</div>
<div class="cell">4</div>
<div class="cell">5</div>
<div class="cell">6</div>
<div class="cell">7</div>
<div class="cell">8</div>

<div class="cell"><strong>Monday</strong></div>
<div class="cell workshop">Workshop</div>
<div class="cell workshop">Workshop</div>
<div class="cell maths">Maths</div>
<div class="cell break">Break</div>
<div class="cell english">English</div>
<div class="cell python">Python</div>
<div class="cell chemistry">Chemistry</div>
<div class="cell"></div>

<div class="cell"><strong>Tuesday</strong></div>
<div class="cell english">English</div>
<div class="cell maths">Maths</div>
<div class="cell chemistry">Chemistry</div>
<div class="cell break">Break</div>
<div class="cell python">Python</div>
<div class="cell maths">Maths</div>
<div class="cell">Library</div>
<div class="cell"></div>

</div>

</div>

<script>
function toggleTheme() {
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
